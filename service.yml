name: opensearch
title: OpenSearch
guidance: GUIDANCE.md
icon: opensearch
type: search
scalable: false

labels:
- opensearch
- search

options:
- version: '3.8'
  tag: '3.8.0'
  default: true

endpoints:
- name: opensearch
  ports:
  - name: api
    number: 9200
    protocol: tcp
    main: true
    private: true
  - name: transport
    number: 9300
    protocol: tcp
    private: true
  - name: metrics
    number: 9600
    protocol: http
    private: true

tokens:
- name: password
  generate:
    # OpenSearch refuses an initial admin password without an uppercase letter, a lowercase letter, a digit and a
    # special character, so the first four characters guarantee one of each.
    regex: '[A-Z][a-z][0-9][!@#%_-][A-Za-z0-9!@#%_-]{28}'
- name: dashboards_password
  generate:
    regex: '[A-Z][a-z][0-9][!@#%_-][A-Za-z0-9!@#%_-]{28}'

env:
- name: discovery.type
  value: single-node
- name: cluster.name
  value: '{{app.name}}-{{instance.name}}'
- name: bootstrap.memory_lock
  value: 'false'
- name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
  value: '{{password}}'
  secret: true
- name: DASHBOARDS_SERVER_PASSWORD
  value: '{{dashboards_password}}'
  secret: true
- name: OPENSEARCH_JAVA_OPTS
  value: -Xms1g -Xmx1g

volumes:
- name: data
  title: OpenSearch data
  size: 20
  helm:
    labels: persistence.labels
    values:
    - name: persistence.enabled
      value: true
    - name: persistence.existingClaim
      value: '{{volumes.data.claim}}'
    - name: persistence.size
      value: '{{volumes.data.size}}Gi'

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/stateful
  chart: oci://registry-1.docker.io/wodby/stateful
  version: 0.2.0
  valueMappings:
    replicas: replicaCount
    nameOverride: nameOverride
    fullnameOverride: fullnameOverride
    serviceAccountName: serviceAccount.name
    serviceAccountCreate: serviceAccount.create
    strategy: updateStrategy.type
    minReady: minReadySeconds
    shutdownGracePeriod: terminationGracePeriodSeconds
  values:
  - name: containerName
    value: opensearch
  - name: containerPorts
    value:
    - name: api
      containerPort: 9200
      protocol: TCP
    - name: transport
      containerPort: 9300
      protocol: TCP
    - name: metrics
      containerPort: 9600
      protocol: TCP
  - name: headlessService.enabled
    value: false
  - name: persistence.mountPath
    value: /usr/share/opensearch/data
  - name: lifecycle
    value:
      postStart:
        exec:
          command:
          - /bin/bash
          - -ec
          - |
            # The image's demo security configuration creates accounts whose passwords are public. Give the Dashboards
            # server account a generated password and remove the rest. Both changes persist in the security index.
            config=/usr/share/opensearch/config
            [ -f "$config/kirk.pem" ] || exit 0
            api() {
              curl --silent --insecure --cert "$config/kirk.pem" --key "$config/kirk-key.pem" \
                --header "Content-Type: application/json" "$@"
            }
            for ((attempt=1; attempt<=120; attempt++)); do
              # A node with the security plugin disabled answers plain HTTP and has no accounts to change.
              if curl --silent --fail --output /dev/null http://127.0.0.1:9200/; then
                exit 0
              fi
              if printf '{"password":"%s","reserved":true,"description":"OpenSearch Dashboards server account"}' "$DASHBOARDS_SERVER_PASSWORD" |
                api --show-error --fail --output /dev/null --request PUT --data @- \
                  https://127.0.0.1:9200/_plugins/_security/api/internalusers/kibanaserver; then
                for user in kibanaro logstash readall snapshotrestore anomalyadmin; do
                  status=$(api --output /dev/null --write-out '%{http_code}' --request DELETE \
                    "https://127.0.0.1:9200/_plugins/_security/api/internalusers/$user")
                  case "$status" in
                    200|404) ;;
                    *) echo "Could not remove the demo account $user: HTTP $status" >&2; exit 1 ;;
                  esac
                done
                exit 0
              fi
              sleep 5
            done
            echo "Timed out securing the demo accounts" >&2
            exit 1
  - name: startupProbe
    value:
      tcpSocket:
        port: api
      failureThreshold: 30
      periodSeconds: 10
  - name: readinessProbe
    value:
      tcpSocket:
        port: api
      periodSeconds: 10
  - name: livenessProbe
    value:
      tcpSocket:
        port: api
      initialDelaySeconds: 60
      periodSeconds: 20
  - name: podSecurityContext
    value:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: statefulset
  primary: true
  helm:
    labels: podLabels
    annotations: podAnnotations
    volumes: extraVolumes
  containers:
  - name: opensearch
    image: opensearchproject/opensearch
    helm:
      resources: resources
      env: envVars
      mounts: extraVolumeMounts
